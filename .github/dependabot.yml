version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies, build]
    commit-message:
      prefix: build
    groups:
      development-tools:
        patterns: [mypy, pytest*, ruff]
  - package-ecosystem: npm
    directory: /site
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies, documentation]
    commit-message:
      prefix: build
    groups:
      starlight:
        patterns: [astro, "@astrojs/*", starlight-*]
