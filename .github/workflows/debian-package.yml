name: Debian package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates git debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-hatchling python3-hatch-vcs lintian
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the package and check it with lintian
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          make deb
      - uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: dist/lacis_*.deb
          if-no-files-found: error

  install:
    name: Install and launch
    needs: build
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: dist
      - name: Update the package lists and check that they all come from Debian
        run: |
          apt-get update
          origins=$(apt-cache policy | grep -oE 'https?://[^ ]+' | sort -u)
          echo "$origins"
          test -n "$origins"
          test -z "$(echo "$origins" | grep -vE '^https?://deb\.debian\.org/')"
      - name: Install the package with apt
        run: apt-get install --yes ./dist/lacis_*.deb
      - name: Launch Lacis
        run: lacis --version | grep -E '^Lacis [0-9]'
      - name: Install the test tools from Debian
        run: |
          apt-get install --yes --no-install-recommends \
            ca-certificates git python3-pyside6.qttest python3-pytest python3-pytestqt
      - uses: actions/checkout@v4
      - name: Run the tests against the installed package and the PySide6 of Debian
        run: |
          python3 -c "import lacis, sys; sys.exit(not lacis.__file__.startswith('/usr/lib/python3/'))"
          python3 -m pytest -p no:cacheprovider
