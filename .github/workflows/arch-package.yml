name: Arch Linux package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build on Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install the build tools and the dependencies of the package
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git make namcap \
            python-build python-hatch-vcs python-hatchling python-installer \
            hicolor-icon-theme pyside6 python python-httpx qt6-svg
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the package as an unprivileged user and check it with namcap
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder --command "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH make arch"
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: dist/lacis-*.pkg.tar.zst
          if-no-files-found: error

  install:
    name: Install and launch on Arch Linux
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: arch-package
          path: dist
      - name: Install the package with pacman
        run: |
          pacman -Syu --noconfirm
          pacman -U --noconfirm dist/lacis-*.pkg.tar.zst
      - name: Check that every other installed package comes from the Arch Linux repositories
        run: |
          foreign=$(pacman -Qmq)
          echo "$foreign"
          test "$foreign" = lacis
      - name: Launch Lacis
        run: lacis --version | grep -E '^Lacis [0-9]'
      - name: Install the test tools from Arch Linux
        run: pacman -S --noconfirm --needed git python-pytest python-pytest-qt
      - uses: actions/checkout@v4
      - name: Run the tests against the installed package and the PySide6 of Arch Linux
        run: |
          python -c "import lacis, sys; sys.exit(not lacis.__file__.startswith('/usr/lib/python3'))"
          python -m pytest -p no:cacheprovider
