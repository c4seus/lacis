name: Windows installer

on:
  workflow_call:

permissions:
  contents: read

env:
  INNO_SETUP_VERSION: "7.1.1"
  INNO_SETUP_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
  INNO_SETUP_PUBLISHER: Pyrsys B.V.

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Lacis and Nuitka
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -e ".[windows-installer]"
      - name: Install Inno Setup for the current user, after checking its fingerprint
        run: |
          $tag = "is-" + $env:INNO_SETUP_VERSION.Replace(".", "_")
          $name = "innosetup-$env:INNO_SETUP_VERSION-x64.exe"
          $installer = Join-Path $env:RUNNER_TEMP $name
          $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/$name"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $fingerprint = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($fingerprint -ne $env:INNO_SETUP_SHA256) {
            throw "Unexpected SHA256 $fingerprint for $name"
          }
          $signature = Get-AuthenticodeSignature $installer
          $signer = $signature.SignerCertificate.GetNameInfo("SimpleName", $false)
          if ($signature.Status -ne "Valid" -or $signer -ne $env:INNO_SETUP_PUBLISHER) {
            throw "Unexpected signature $($signature.Status) by $signer for $name"
          }
          $arguments = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER"
          $process = Start-Process $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "The installer of Inno Setup failed with exit code $($process.ExitCode)"
          }
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: nuitka-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-
      - name: Compile Lacis with Nuitka and build the installer
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = python -c "import lacis; print(lacis.__version__)"
          python scripts/build_windows_installer.py $version
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/lacis-*-windows-x64-setup.exe
          if-no-files-found: error
