name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ruff
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: No comments in code
        run: python scripts/check_no_comments.py

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Mypy strict
        run: mypy

  tests:
    name: Tests (${{ matrix.operating-system }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Pytest with coverage
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.operating-system == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml

  desktop-metadata:
    name: Desktop metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends appstream desktop-file-utils
      - name: Validate the desktop entry, the metainfo and the installed tree
        run: make desktop-metadata

  debian-package:
    name: Debian package
    uses: ./.github/workflows/debian-package.yml

  fedora-package:
    name: Fedora package
    uses: ./.github/workflows/fedora-package.yml

  arch-package:
    name: Arch Linux package
    uses: ./.github/workflows/arch-package.yml

  windows-installer:
    name: Windows installer
    uses: ./.github/workflows/windows-installer.yml

  commits:
    name: Commit convention
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check commit subjects
        run: >
          python scripts/check_commits.py
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}

  ci-passed:
    name: CI passed
    if: always()
    needs:
      - lint
      - types
      - tests
      - desktop-metadata
      - debian-package
      - fedora-package
      - arch-package
      - windows-installer
      - commits
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
